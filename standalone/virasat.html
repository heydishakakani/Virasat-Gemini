<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Virasat – Find what they left behind</title>
  <meta name="description" content="Virasat helps families discover a loved one's financial and other assets, check nominee details and get clear next steps.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <style>
/* Virasat — design tokens and components
   Direction: warm paper, deep forest green, a literary serif for voice and a quiet sans for work.
   Status colours are semantic only (present / missing / needs review). */

:root {
  --paper: #f8f1e1;
  --paper-2: #f3e9d2;
  --surface: #fffdf8;
  --line: #e7dcc3;
  --line-soft: #efe6d1;
  --ink: #1c231f;
  --ink-soft: #55605a;
  --ink-faint: #8a9189;
  --green: #12453a;
  --green-2: #1b5a4b;
  --sage: #e1ebdd;
  --sage-2: #cfdfc9;
  --present: #2c7a4d;
  --present-bg: #e1f0e4;
  --missing: #b8402f;
  --missing-bg: #f8e2dc;
  --review: #b57a12;
  --review-bg: #f8ecce;
  --radius: 14px;
  --radius-lg: 22px;
  --shadow: 0 1px 0 rgba(28, 35, 31, .04), 0 18px 40px -26px rgba(48, 38, 12, .35);
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --script: "Caveat", "Segoe Script", cursive;
  --gutter: clamp(16px, 4vw, 40px);
  --max: 1180px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; letter-spacing: -.015em; line-height: 1.1; margin: 0; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid #5aa488; outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--green); color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 100; }
.skip:focus { left: 8px; }

/* ---------- layout ---------- */
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
.narrow { max-width: 720px; margin: 0 auto; padding: 0 var(--gutter); }

/* ---------- header ---------- */
.site-header { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.site-header.scrolled { border-color: var(--line); }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 20px; height: 68px; }
.logo { display: inline-flex; align-items: center; gap: 9px; font-family: var(--serif); font-size: 1.55rem; font-weight: 600; text-decoration: none; color: var(--green); letter-spacing: -.02em; }
.logo svg { width: 26px; height: 26px; }
.nav { display: flex; gap: 28px; }
.nav a { text-decoration: none; font-size: .92rem; color: var(--ink-soft); padding: 6px 0; }
.nav a:hover { color: var(--ink); }
.header-actions { display: flex; align-items: center; gap: 12px; }
.link-btn { background: none; border: 0; padding: 8px 4px; cursor: pointer; font-size: .92rem; text-decoration: none; }
.link-btn:hover { text-decoration: underline; }
.btn.menu-btn { display: none; }
@media (max-width: 860px) {
  .nav { display: none; }
  .nav.open { display: flex; position: absolute; top: 68px; left: 0; right: 0; flex-direction: column; gap: 4px; background: var(--paper); border-bottom: 1px solid var(--line); padding: 12px var(--gutter) 18px; }
  .nav.open a { padding: 10px 0; font-size: 1rem; }
  .btn.menu-btn { display: inline-flex; }
  .header-actions .hide-sm { display: none; }
}

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border-radius: 999px; padding: 13px 24px; font-weight: 600; font-size: .95rem; border: 1.5px solid var(--green); background: transparent; color: var(--green); cursor: pointer; text-decoration: none; transition: background .15s, color .15s, transform .1s; }
.btn:hover { background: var(--sage); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: var(--green-2); }
.btn-block { width: 100%; }
.btn-sm { padding: 9px 18px; font-size: .88rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* ---------- landing: hero ---------- */
.hero { padding: clamp(28px, 5vw, 56px) 0 0; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; }
.hero-kicker { font-size: .85rem; color: var(--ink-soft); background: var(--paper-2); display: inline-block; padding: 7px 14px; border-radius: 999px; margin-bottom: 22px; }
.hero h1 { font-size: clamp(2.8rem, 7vw, 5rem); line-height: 1.02; letter-spacing: -.025em; }
.hero p.lead { margin-top: 22px; max-width: 46ch; font-size: 1.08rem; color: var(--ink-soft); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.hero-art { position: relative; border-radius: 220px 220px var(--radius-lg) var(--radius-lg); overflow: hidden; aspect-ratio: 4 / 4.4; background: #ead9b4; box-shadow: var(--shadow); }
.hero-art svg { width: 100%; height: 100%; }
.play { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%; border: 0; background: rgba(255, 253, 248, .86); backdrop-filter: blur(6px); display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); transition: transform .2s; }
.play:hover { transform: translate(-50%, -50%) scale(1.06); }
.play svg { width: 30px; height: 30px; margin-left: 4px; color: var(--green); }
.hero-quote { position: absolute; left: 27%; right: 27%; bottom: 3%; font-family: var(--script); font-size: clamp(1.1rem, 2vw, 1.4rem); line-height: 1.05; color: var(--green); text-align: center; }
@media (max-width: 860px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-art { max-width: 460px; width: 100%; margin: 0 auto; }
}
.benefits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 44px; padding: 26px 0 8px; }
.benefit { display: flex; gap: 14px; align-items: flex-start; }
.ico { width: 46px; height: 46px; border-radius: 50%; background: #fbe9bd; color: var(--green); display: grid; place-items: center; flex: none; }
.ico svg { width: 22px; height: 22px; }
.benefit b { display: block; font-size: .95rem; }
.benefit span { font-size: .85rem; color: var(--ink-soft); }
@media (max-width: 860px) { .benefits { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .benefits { grid-template-columns: 1fr; } }

/* ---------- landing: sections ---------- */
section.block { padding: clamp(48px, 8vw, 96px) 0 0; }
.section-head { max-width: 640px; }
.section-head h2 { font-size: clamp(2rem, 4.5vw, 3rem); }
.section-head p { margin-top: 14px; color: var(--ink-soft); max-width: 52ch; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 40px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.step { padding: 28px 24px 30px; border-right: 1px solid var(--line-soft); }
.step:last-child { border-right: 0; }
.step .ico { background: #fbe9bd; margin-bottom: 18px; }
.step h3 { font-size: 1.2rem; font-family: var(--sans); font-weight: 650; letter-spacing: 0; line-height: 1.25; }
.step p { margin-top: 10px; font-size: .9rem; color: var(--ink-soft); }
@media (max-width: 960px) { .steps { grid-template-columns: 1fr 1fr; } .step:nth-child(2) { border-right: 0; } .step:nth-child(-n+2) { border-bottom: 1px solid var(--line-soft); } }
@media (max-width: 560px) { .steps { grid-template-columns: 1fr; } .step { border-right: 0; border-bottom: 1px solid var(--line-soft); } .step:last-child { border-bottom: 0; } }
.assets-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.asset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 26px; }
.asset-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.asset-tile .ico { background: transparent; border: 1px solid var(--line); width: 40px; height: 40px; }
.asset-tile b { font-size: .95rem; line-height: 1.3; }
.asset-tile span { font-size: .82rem; color: var(--ink-soft); }
@media (max-width: 860px) { .asset-grid { grid-template-columns: 1fr 1fr; } }
.promise { margin-top: clamp(48px, 8vw, 96px); background: var(--green); color: #f5efe0; border-radius: var(--radius-lg); padding: clamp(28px, 5vw, 56px); display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; }
.promise h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); color: #fff; }
.promise ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; }
.promise li { display: flex; gap: 12px; font-size: .98rem; color: #e6efe6; }
.promise li svg { width: 22px; height: 22px; flex: none; margin-top: 2px; color: #bfe3c8; }
@media (max-width: 760px) { .promise { grid-template-columns: 1fr; } }
.faq { max-width: 760px; }
.faq details { border-bottom: 1px solid var(--line); padding: 18px 0; }
.faq summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-size: 1.4rem; line-height: 1; color: var(--ink-faint); transition: transform .2s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq p { margin-top: 10px; color: var(--ink-soft); font-size: .95rem; max-width: 62ch; }
.cta-band { margin: clamp(48px, 8vw, 96px) 0; text-align: center; padding: clamp(36px, 6vw, 72px) 20px; border-radius: var(--radius-lg); background: var(--sage); }
.cta-band h2 { font-size: clamp(1.9rem, 4vw, 2.7rem); }
.cta-band p { margin: 12px auto 26px; color: var(--ink-soft); max-width: 44ch; }
.site-footer { border-top: 1px solid var(--line); padding: 28px 0 40px; font-size: .88rem; color: var(--ink-soft); }
.site-footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; }
.site-footer nav { display: flex; gap: 22px; }

/* ---------- app screens ---------- */
.screen { padding: clamp(24px, 5vw, 56px) 0 clamp(48px, 7vw, 88px); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.demo-note { display: flex; gap: 10px; align-items: flex-start; background: var(--review-bg); color: #6b4a08; border-radius: 12px; padding: 12px 16px; font-size: .88rem; margin-bottom: 20px; }
.demo-note svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }

/* login */
.auth { display: grid; grid-template-columns: 1.1fr .9fr; max-width: 940px; margin: 0 auto; overflow: hidden; }
.auth-form { padding: clamp(24px, 4vw, 48px); }
.auth-form h1 { font-size: 2.1rem; }
.auth-form .sub { color: var(--ink-soft); margin-top: 6px; font-size: .95rem; }
.tabs { display: flex; margin: 26px 0 20px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 10px 18px; cursor: pointer; font-weight: 600; color: var(--ink-faint); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--green); border-color: var(--green); }
.divider { display: flex; align-items: center; gap: 12px; color: var(--ink-faint); font-size: .82rem; margin: 20px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sso { display: grid; gap: 10px; }
.sso .btn { border-color: var(--line); color: var(--ink); background: var(--surface); font-weight: 500; justify-content: center; }
.sso .btn:hover { background: var(--paper); }
.auth-art { background: linear-gradient(160deg, #f2e2bd, #e7d4a6); position: relative; display: flex; align-items: flex-end; padding: 34px; min-height: 280px; overflow: hidden; }
.auth-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.auth-art p { position: relative; font-family: var(--script); font-size: 2.1rem; line-height: 1.05; color: var(--green); }
@media (max-width: 760px) { .auth { grid-template-columns: 1fr; } .auth-art { display: none; } }

/* forms */
.field { display: grid; gap: 7px; margin-bottom: 18px; }
.field label, .field .label { font-size: .88rem; font-weight: 600; }
.field .hint { font-size: .8rem; color: var(--ink-faint); font-weight: 400; }
.input, select.input { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; transition: border-color .15s, box-shadow .15s; }
.input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(18, 69, 58, .12); }
.input[aria-invalid="true"] { border-color: var(--missing); }
.err { color: var(--missing); font-size: .82rem; min-height: 1.1em; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 560px) { .row-2 { grid-template-columns: 1fr; } }
.privacy { display: flex; gap: 12px; align-items: flex-start; background: var(--sage); border-radius: 12px; padding: 14px 16px; font-size: .85rem; color: #35483f; margin: 4px 0 22px; }
.privacy svg { width: 20px; height: 20px; flex: none; margin-top: 1px; color: var(--green); }
.form-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.form-actions .btn { flex: 1 1 140px; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: .9rem; margin: 6px 0 22px; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--green); }

/* choose */
.choose { max-width: 680px; margin: 0 auto; }
.choose h1 { font-size: clamp(2rem, 4.5vw, 2.8rem); }
.choose .sub { color: var(--ink-soft); margin-top: 8px; }
.option { display: flex; align-items: center; gap: 18px; width: 100%; text-align: left; padding: 22px; margin-top: 16px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius); transition: border-color .15s, background .15s; }
.option:hover:not([disabled]) { border-color: var(--green); background: #fcfaf3; }
.option[disabled] { opacity: .6; cursor: not-allowed; }
.option .ico { width: 56px; height: 56px; background: var(--sage); }
.option b { display: block; font-size: 1.05rem; }
.option span { color: var(--ink-soft); font-size: .9rem; }
.option .tag { margin-left: auto; font-size: .75rem; background: var(--paper-2); padding: 4px 10px; border-radius: 999px; white-space: nowrap; color: var(--ink-soft); }
.choose-art { margin-top: 28px; border-radius: var(--radius-lg); overflow: hidden; height: 190px; background: #ecdcb5; }
.choose-art svg { width: 100%; height: 100%; }

/* wizard */
.wizard { max-width: 640px; margin: 0 auto; padding: clamp(22px, 4vw, 40px); }
.stepper { display: flex; align-items: center; gap: 8px; margin-bottom: 30px; font-size: .78rem; color: var(--ink-faint); }
.stepper .s { display: flex; align-items: center; gap: 8px; }
.stepper .dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .75rem; font-weight: 700; background: var(--surface); }
.stepper .s.on .dot { background: var(--green); border-color: var(--green); color: #fff; }
.stepper .s.done .dot { background: var(--sage-2); border-color: var(--sage-2); color: var(--green); }
.stepper .s.on .lbl { color: var(--ink); font-weight: 600; }
.stepper .bar { flex: 1; height: 1px; background: var(--line); min-width: 12px; }
@media (max-width: 520px) { .stepper .lbl { display: none; } .stepper .s.on .lbl { display: inline; } }
.wizard h1 { font-size: clamp(1.7rem, 4vw, 2.2rem); }
.wizard .sub { color: var(--ink-soft); margin: 8px 0 24px; font-size: .95rem; }
.summary { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
.summary h3 { font-family: var(--sans); font-size: .95rem; font-weight: 650; padding: 14px 18px; background: var(--paper); display: flex; justify-content: space-between; letter-spacing: 0; }
.summary h3 button { background: none; border: 0; color: var(--green); font-size: .85rem; cursor: pointer; text-decoration: underline; }
.summary dl { margin: 0; padding: 6px 18px 10px; display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; font-size: .9rem; }
.summary dt { color: var(--ink-soft); }
.summary dd { margin: 0; font-weight: 550; }
.otp { display: flex; gap: 10px; }
.otp input { width: 100%; text-align: center; font-size: 1.3rem; padding: 12px 0; }

/* searching */
.searching { max-width: 640px; margin: 0 auto; text-align: center; padding: clamp(28px, 5vw, 56px) clamp(20px, 4vw, 40px); }
.search-art { width: 150px; height: 130px; margin: 0 auto 18px; position: relative; }
.search-art svg { width: 100%; height: 100%; }
.pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.searching h1 { font-size: 2rem; }
.searching .sub { color: var(--ink-soft); margin-top: 8px; font-size: .95rem; }
.checklist { text-align: left; list-style: none; padding: 0; margin: 26px auto 22px; display: grid; gap: 12px; max-width: 420px; }
.checklist li { display: flex; gap: 12px; align-items: center; color: var(--ink-faint); font-size: .95rem; transition: color .3s; }
.checklist li .mk { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; }
.checklist li.done { color: var(--ink); }
.checklist li.done .mk { background: var(--present); border-color: var(--present); color: #fff; }
.checklist li.now .mk { border-color: var(--green); border-top-color: transparent; animation: spin 1s linear infinite; }
.checklist li .mk svg { width: 13px; height: 13px; display: none; }
.checklist li.done .mk svg { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
.assure { display: flex; gap: 10px; align-items: center; justify-content: center; background: var(--sage); border-radius: 12px; padding: 12px 16px; font-size: .85rem; color: #35483f; text-align: left; }
.assure svg { width: 20px; height: 20px; flex: none; color: var(--green); }

/* results */
.results-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: end; margin-bottom: 22px; }
.results-head h1 { font-size: clamp(2rem, 4.5vw, 3rem); }
.results-head h1 em { font-style: normal; color: var(--green); }
.results-head p { color: var(--ink-soft); margin-top: 8px; font-size: .95rem; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
.kpi .n { font-family: var(--serif); font-size: 2.4rem; line-height: 1; }
.kpi .t { font-size: .85rem; color: var(--ink-soft); line-height: 1.25; }
.kpi .kico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.kpi .kico svg { width: 22px; height: 22px; }
.kpi.missing .kico { background: var(--missing-bg); color: var(--missing); }
.kpi.review .kico { background: var(--review-bg); color: var(--review); }
.kpi.good .kico { background: var(--present-bg); color: var(--present); }
@media (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr; } }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip-filter { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 15px; font-size: .85rem; cursor: pointer; font-weight: 550; }
.chip-filter[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
.table-card { overflow: hidden; }
table.assets { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.assets th { text-align: left; font-weight: 600; font-size: .8rem; color: var(--ink-soft); padding: 14px 18px; background: var(--paper); border-bottom: 1px solid var(--line); }
table.assets td { padding: 16px 18px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.assets tr:last-child td { border-bottom: 0; }
.asset-name { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.asset-name .ico { width: 36px; height: 36px; background: var(--paper-2); }
.asset-name .ico svg { width: 18px; height: 18px; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: .82rem; font-weight: 600; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.present { background: var(--present-bg); color: var(--present); }
.status.missing { background: var(--missing-bg); color: var(--missing); }
.status.review { background: var(--review-bg); color: var(--review); }
.next { color: var(--green); font-weight: 600; text-decoration: none; background: none; border: 0; cursor: pointer; padding: 0; white-space: nowrap; }
.next:hover { text-decoration: underline; }
@media (max-width: 760px) {
  table.assets thead { display: none; }
  table.assets, table.assets tbody, table.assets tr, table.assets td { display: block; width: 100%; }
  table.assets tr { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  table.assets td { border: 0; padding: 4px 0; }
  table.assets td[data-l]::before { content: attr(data-l) ": "; color: var(--ink-faint); font-size: .8rem; }
}
.empty { padding: 36px 20px; text-align: center; color: var(--ink-soft); }

/* asset detail */
.back { background: none; border: 0; cursor: pointer; color: var(--ink-soft); font-size: .9rem; margin-bottom: 16px; padding: 4px 0; }
.back:hover { color: var(--ink); }
.detail-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 24px; }
.detail-head .ico { width: 58px; height: 58px; background: var(--sage); }
.detail-head h1 { font-size: clamp(1.6rem, 3.5vw, 2.1rem); }
.detail-head .meta { color: var(--ink-soft); font-size: .9rem; margin-top: 4px; }
.detail-head .status { margin-left: auto; }
.detail-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; margin-top: 18px; }
@media (max-width: 860px) { .detail-grid { grid-template-columns: 1fr; } }
.panel { padding: 22px 24px; }
.panel h2 { font-size: 1.3rem; margin-bottom: 14px; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 10px 14px; margin: 0; font-size: .92rem; }
.kv dt { color: var(--ink-soft); }
.kv dd { margin: 0; font-weight: 550; }
.guidance { background: var(--sage); border: 0; }
.guidance ol { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: .93rem; }
.guidance .btn { margin-top: 18px; }
.docs { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; font-size: .92rem; }
.docs li { display: flex; gap: 10px; align-items: flex-start; }
.docs svg { width: 18px; height: 18px; flex: none; margin-top: 3px; color: var(--green); }

/* ---------- Virasat AI ---------- */
.ai-fab { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: inline-flex; gap: 9px; align-items: center; background: var(--green); color: #fff; border: 0; border-radius: 999px; padding: 13px 20px; font-weight: 600; cursor: pointer; box-shadow: 0 14px 30px -12px rgba(18, 69, 58, .7); }
.ai-fab svg { width: 20px; height: 20px; }
@media (max-width: 560px) { .ai-fab { padding: 14px; right: 12px; bottom: 12px; } .ai-fab .t { display: none; } }
.ai { position: fixed; right: 18px; bottom: 18px; z-index: 70; width: min(400px, calc(100vw - 24px)); height: min(640px, calc(100vh - 36px)); display: none; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: 0 30px 70px -20px rgba(30, 24, 8, .5); overflow: hidden; }
.ai.open { display: flex; }
.ai header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.ai header b { font-family: var(--serif); font-size: 1.25rem; font-weight: 600; color: var(--green); }
.ai header .beta { font-size: .7rem; background: var(--sage); color: var(--green); border-radius: 6px; padding: 2px 7px; margin-left: 8px; font-family: var(--sans); font-weight: 600; }
.ai header button { background: none; border: 0; cursor: pointer; font-size: 1.4rem; line-height: 1; color: var(--ink-soft); padding: 4px 8px; }
.ai .log { flex: 1; overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; padding: 12px 14px; border-radius: 14px; font-size: .92rem; white-space: pre-wrap; }
.msg.bot { background: var(--paper); border-top-left-radius: 4px; }
.msg.me { background: var(--green); color: #fff; align-self: flex-end; border-top-right-radius: 4px; }
.msg.err { background: var(--missing-bg); color: var(--missing); }
.ai .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 10px; }
.ai .chips button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .8rem; cursor: pointer; }
.ai .chips button:hover { border-color: var(--green); }
.ai form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.ai form input { flex: 1; border: 1.5px solid var(--line); border-radius: 999px; padding: 11px 16px; background: var(--paper); }
.ai form input:focus { outline: none; border-color: var(--green); }
.ai form button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--green); color: #fff; cursor: pointer; display: grid; place-items: center; }
.ai form button svg { width: 18px; height: 18px; }
.ai form button[disabled] { opacity: .5; }
.ai .foot { font-size: .72rem; color: var(--ink-faint); padding: 0 16px 12px; display: flex; justify-content: space-between; gap: 10px; }

/* video dialog */
dialog.video { border: 0; border-radius: var(--radius-lg); padding: 0; width: min(760px, 94vw); background: var(--surface); }
dialog.video::backdrop { background: rgba(20, 24, 20, .6); }
dialog.video .inner { padding: 20px; }
dialog.video video { width: 100%; border-radius: 12px; background: #000; }
dialog.video .fallback { padding: 20px 8px; color: var(--ink-soft); font-size: .95rem; }
dialog.video .fallback code { background: var(--paper); padding: 2px 6px; border-radius: 6px; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

  document.addEventListener("submit", (e) => {

    const f = form.elements;

      const name = f.name.value.trim();
      const check = (field, bad, msg) => {
        setErr(form, field, bad ? msg : "");
        if (bad) ok = false;
      };
      check("name", name.length < 2 || !/^[\p{L}][\p{L}\s.'-]+$/u.test(name), "Enter the full name using letters only.");
      check("dob", !f.dob.value || f.dob.value > today, "Enter a valid date of birth.");
      check("dod", f.dod.value && (f.dod.value > today || f.dod.value < f.dob.value), "Date of death must be after birth and not in the future.");
      check("aadhaar", digits(f.aadhaar.value).length !== 12, "Enter all 12 digits of the Aadhaar number.");
      if (!ok) return form.querySelector('[aria-invalid="true"]')?.focus();
      Object.assign(state.deceased, { name, dob: f.dob.value, dod: f.dod.value, aadhaar: digits(f.aadhaar.value) });

    }
    if (kind === "step2") {
      const a = state.applicant;
      if (!a.otpSent) {
        if (digits(f.aadhaar.value).length !== 12) {
          setErr(form, "aadhaar", "Enter all 12 digits of your Aadhaar number.");
          return f.aadhaar.focus();
        }
        a.aadhaar = digits(f.aadhaar.value);
        a.otpSent = true;
        render();
        return $("#otp")?.focus();
      }
      if (digits(f.otp.value).length !== 6) {
        setErr(form, "otp", "Enter the 6-digit OTP.");
        return f.otp.focus();
      }
      a.verified = true;
      return go("/step3");
    }
    if (kind === "step3") {
      let ok = true;
      if (!f.rel.value) {
        setErr(form, "rel", "Select your relationship.");
        ok = false;
      } else setErr(form, "rel", "");
      const box = f.ok;
      const err = $('[data-err="ok"]', form);
      if (!box.checked) {
        err.textContent = "Please confirm before starting the search.";
        ok = false;
      } else err.textContent = "";

      state.relationship = f.rel.value;

  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-action]");
    if (!t) return;
    const act = t.dataset.action;
    if (act === "goto") return go(t.dataset.to);
    if (act === "method") {
      state.applicant.method = t.dataset.id;
      return render();
    }
    if (act === "resend") {
      state.applicant.otpSent = false;
      return render();
    }
    if (act === "filter") {
      state.filter = t.dataset.id;
      return render();
    }
    if (act === "dtab") {
      state.detailTab = t.dataset.id;
      return render();
    }
    if (act === "video") return openVideo();
    if (act === "ask-asset") {
      const a = ASSETS.find((x) => x.id === t.dataset.id);
      openAI();
      return ask(`What should I do next for the ${a.name}? Its nominee status is: ${STATUS[a.status].label.toLowerCase()}.`);
    }
  });
  var header = $("#siteHeader");
  addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 6), { passive: true });
  $("#menuBtn").addEventListener("click", () => {
    const open = $("#nav").classList.toggle("open");
    $("#menuBtn").setAttribute("aria-expanded", String(open));
  });
  async function openVideo() {
    const dlg = $("#videoDlg");
    const body = $("#videoBody");
    let ok = false;
    try {
      ok = (await fetch("/media/story.mp4", { method: "HEAD" })).ok;
    } catch {
    }
    body.innerHTML = ok ? '<video controls autoplay playsinline src="/media/story.mp4"></video>' : '<div class="fallback"><p><b>Your story video goes here.</b></p><p style="margin-top:8px">Add a file named <code>story.mp4</code> to <code>public/media/</code> and it will play in this window.</p></div>';
    body.insertAdjacentHTML("beforeend", '<div class="form-actions" style="margin-top:14px"><button class="btn btn-sm" data-close>Close</button></div>');

  $("#videoDlg").addEventListener("click", (e) => {
    if (e.target.matches("[data-close]") || e.target === e.currentTarget) {
      $("#videoBody video")?.pause();
      e.currentTarget.close();
    }
  });
  var ai = $("#ai");
  var log = $("#aiLog");
  var input = $("#aiInput");

  var NUM_RE = /(?<!\d)\d(?:[\s-]?\d){7,}(?!\d)/g;

  function redact(q) {

  $("#aiOpen").addEventListener("click", openAI);
  $("#aiClose").addEventListener("click", closeAI);

  $("#aiChips").addEventListener("click", (e) => {

    const q = input.value.trim();
    if (q) {
      input.value = "";
      ask(q);

  async function ask(raw) {
    const { text, changed } = redact(raw);
    bubble(text, "me");

      wait.textContent = "Can\u2019t reach the Virasat server. Run npm start and open http://localhost:3000.";

      log.scrollTop = log.scrollHeight;

  hydrateIcons(document);
  addEventListener("hashchange", render);
  render();
})();
