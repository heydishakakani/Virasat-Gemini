<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Virasat – Every asset, checked for a nominee</title>
  <meta name="description" content="List what your family member owned. Virasat checks each asset for a nominee and tells you what to do next.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* Virasat guided flow, Evernote edition.
   Same tokens, type and components as the landing page at "/":
   cream paper, white cards, a single green, Poppins headings, dark pill buttons. */

:root {
  --bg: #f6f3ea; --surface: #ffffff; --line: #e6e1d3;
  --ink: #17181a; --ink-soft: #55564f; --ink-faint: #8b8c82;
  --green: #1e8e3e; --green-soft: #e3f3e6; --green-deep: #146a2e;
  --chip: #efece0;
  --red: #a3352d; --red-soft: #fbe3e1; --amber: #c9a24a;
  --shadow: 0 30px 60px -36px rgba(20, 20, 16, .3);
  --heading: "Poppins", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter: clamp(16px, 4vw, 40px);
  --max: 1160px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141513; --surface: #1e201c; --line: #33352d;
    --ink: #f2f1ea; --ink-soft: #b7b6ac; --ink-faint: #82837a;
    --green: #4fc26a; --green-soft: #1c2a1f; --green-deep: #7bdc93;
    --chip: #232520; --red: #f0a9a3; --red-soft: #3a1f1d; --shadow: 0 30px 60px -36px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--heading); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; margin: 0; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
svg { display: block; max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; border-radius: 6px; }
#view:focus, #view:focus-visible { outline: none; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 100; }
.skip:focus { left: 8px; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

/* ---------- header (same as landing) ---------- */
.site-header { position: sticky; top: 0; z-index: 40; background: var(--bg); border-bottom: 1px solid transparent; transition: border-color .25s, box-shadow .25s; }
.site-header.scrolled { border-color: var(--line); box-shadow: 0 8px 24px -18px rgba(20, 20, 16, .3); }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 18px; padding-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--heading); font-weight: 800; font-size: 1.15rem; }
.brand .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--green); display: flex; align-items: center; justify-content: center; font-size: .85rem; color: #fff; }
.nav { display: flex; align-items: center; gap: 30px; }
.nav a { font-size: .9rem; font-weight: 500; color: var(--ink-soft); transition: color .15s; }
.nav a:hover { color: var(--ink); }
.header-actions { display: flex; align-items: center; gap: 18px; }
.login { font-size: .88rem; font-weight: 600; }
.login:hover { text-decoration: underline; }
@media (max-width: 820px) {
  .nav { display: none; }
  .nav.open { display: flex; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: flex-start; gap: 14px; background: var(--bg); border-bottom: 1px solid var(--line); padding: 16px var(--gutter) 20px; }
  .header-actions .hide-sm { display: none; }
}
.burger { display: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); align-items: center; justify-content: center; cursor: pointer; flex-direction: column; gap: 4px; }
.burger span { width: 16px; height: 2px; background: var(--ink); }
@media (max-width: 820px) { .burger { display: flex; } }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border-radius: 999px; font-weight: 700; font-size: .9rem; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }
.btn:hover { border-color: var(--ink); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn-primary:hover { background: var(--ink-soft); border-color: var(--ink-soft); }
.btn-block { width: 100%; }
.btn-sm { padding: 9px 18px; font-size: .84rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.btn svg { width: 16px; height: 16px; flex: none; }

/* ---------- screens and cards ---------- */
.screen { padding: clamp(20px, 4vw, 44px) 0 clamp(48px, 7vw, 88px); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.note { display: flex; gap: 10px; align-items: flex-start; background: var(--chip); border-radius: 12px; padding: 12px 16px; font-size: .84rem; color: var(--ink-soft); margin-bottom: 18px; }
.note svg { width: 17px; height: 17px; flex: none; margin-top: 2px; color: var(--amber); }
.privacy { display: flex; gap: 12px; align-items: flex-start; background: var(--green-soft); border-radius: 12px; padding: 14px 16px; font-size: .84rem; color: var(--green-deep); margin: 4px 0 22px; }
.privacy svg { width: 19px; height: 19px; flex: none; margin-top: 1px; }
.ico { width: 40px; height: 40px; border-radius: 11px; background: var(--chip); display: grid; place-items: center; flex: none; font-size: 1.15rem; line-height: 1; }
.ico.green { background: var(--green-soft); color: var(--green-deep); }
.ico svg { width: 20px; height: 20px; }

/* the "Family assets" window, as on the landing page */
.win { overflow: hidden; border-radius: 20px; }
.win-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); font-size: .8rem; color: var(--ink-faint); flex-wrap: wrap; }
.win-bar .sep { opacity: .5; }
.win-bar a:hover, .win-bar button:hover { color: var(--ink); }
.win-bar button { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font-size: inherit; }
.win-body { display: grid; grid-template-columns: 210px 1fr; min-height: 420px; }
.win-side { border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; }
.si { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 11px; border-radius: 8px; font-size: .86rem; color: var(--ink-soft); cursor: pointer; border: 0; background: none; text-align: left; width: 100%; transition: background .15s, color .15s; }
.si:hover { background: var(--chip); color: var(--ink); }
.si[aria-current="true"] { background: var(--chip); color: var(--ink); font-weight: 600; }
.si .n { font-size: .75rem; color: var(--ink-faint); }
.win-main { padding: 28px 32px; min-width: 0; }
.win-main h1 { font-size: 1.35rem; margin-bottom: 6px; }
.win-main .sub { color: var(--ink-soft); font-size: .9rem; margin-bottom: 20px; }
@media (max-width: 760px) {
  .win-body { grid-template-columns: 1fr; }
  .win-side { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; }
  .si { width: auto; border: 1px solid var(--line); border-radius: 999px; }
  .win-main { padding: 20px 16px; }
}

.asset-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; font-size: .88rem; width: 100%; background: var(--surface); text-align: left; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
.asset-row:hover { border-color: var(--green); background: var(--chip); transform: translateX(3px); }
.asset-row .name { display: flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
.asset-row .name small { display: block; font-weight: 400; color: var(--ink-faint); font-size: .76rem; }
.asset-row .icon { width: 30px; height: 30px; border-radius: 8px; background: var(--chip); display: grid; place-items: center; font-size: .9rem; flex: none; }
.asset-row:hover .icon { background: var(--surface); }
.asset-row .right { display: flex; align-items: center; gap: 12px; flex: none; }
.asset-row .go { color: var(--ink-faint); font-size: .8rem; font-weight: 600; }
@media (max-width: 520px) { .asset-row { flex-wrap: wrap; } .asset-row .go { display: none; } }

.status { padding: 5px 12px; border-radius: 999px; font-size: .76rem; font-weight: 700; white-space: nowrap; display: inline-block; }
.status.yes { background: var(--green-soft); color: var(--green-deep); }
.status.no { background: var(--red-soft); color: var(--red); }
.status.unknown { background: var(--chip); color: var(--ink-faint); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
.kpi { background: var(--chip); border-radius: 12px; padding: 14px 16px; }
.kpi .n { font-family: var(--heading); font-weight: 700; font-size: 1.7rem; line-height: 1; }
.kpi .t { font-size: .78rem; color: var(--ink-soft); margin-top: 6px; }
.kpi.no .n { color: var(--red); } .kpi.yes .n { color: var(--green-deep); }
@media (max-width: 560px) { .kpis { grid-template-columns: 1fr 1fr; } }

/* detail */
.detail-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.detail-top .ico { width: 48px; height: 48px; font-size: 1.4rem; background: var(--green-soft); }
.detail-top h1 { font-size: 1.3rem; margin: 0; }
.detail-top .meta { color: var(--ink-faint); font-size: .84rem; }
.detail-top .status { margin-left: auto; }
.tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 18px; gap: 4px; }
.tab { background: none; border: 0; padding: 9px 16px; cursor: pointer; font-weight: 600; font-size: .86rem; color: var(--ink-faint); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--green); }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 10px 14px; margin: 0; font-size: .88rem; }
.kv dt { color: var(--ink-soft); }
.kv dd { margin: 0; font-weight: 600; }
.fv-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; border-radius: 10px; background: var(--chip); margin-bottom: 8px; font-size: .86rem; font-weight: 600; }
.next-box { margin-top: 22px; background: var(--green-soft); border-radius: 14px; padding: 18px 20px; }
.next-box h2 { font-size: 1rem; color: var(--green-deep); margin-bottom: 10px; }
.next-box ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: .88rem; }
.next-box .btn { margin-top: 16px; }
.fine { font-size: .8rem; color: var(--ink-faint); margin-top: 14px; }

/* ---------- centered form cards ---------- */
.center { max-width: 640px; margin: 0 auto; }
.pad { padding: clamp(22px, 4vw, 40px); }
.center h1 { font-size: clamp(1.5rem, 3.4vw, 2rem); }
.center .sub { color: var(--ink-soft); margin: 8px 0 24px; font-size: .92rem; }
.stepper { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; font-size: .78rem; color: var(--ink-faint); }
.stepper .s { display: flex; align-items: center; gap: 8px; }
.stepper .dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .72rem; font-weight: 700; background: var(--surface); }
.stepper .dot svg { width: 12px; height: 12px; }
.stepper .s.on .dot { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.stepper .s.done .dot { background: var(--green-soft); border-color: var(--green-soft); color: var(--green-deep); }
.stepper .s.on .lbl { color: var(--ink); font-weight: 600; }
.stepper .bar { flex: 1; height: 1px; background: var(--line); min-width: 12px; }
@media (max-width: 520px) { .stepper .lbl { display: none; } .stepper .s.on .lbl { display: inline; } }

.field { display: grid; gap: 7px; margin-bottom: 18px; }
.field label { font-size: .84rem; font-weight: 600; }
.field .hint { font-size: .78rem; color: var(--ink-faint); font-weight: 400; }
.input { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; transition: border-color .15s, box-shadow .15s; }
.input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
.input[aria-invalid="true"] { border-color: var(--red); }
.err { color: var(--red); font-size: .8rem; min-height: 1.1em; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 560px) { .row-2 { grid-template-columns: 1fr; } }
.form-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.form-actions .btn { flex: 1 1 140px; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: .88rem; margin: 6px 0 8px; }
.check input { width: 19px; height: 19px; margin-top: 2px; accent-color: var(--green); }
.summary { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
.summary h3 { font-size: .86rem; padding: 12px 18px; background: var(--chip); display: flex; justify-content: space-between; }
.summary h3 button { background: none; border: 0; color: var(--green-deep); font-size: .8rem; font-weight: 600; cursor: pointer; text-decoration: underline; }
.summary dl { margin: 0; padding: 12px 18px; display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; font-size: .88rem; }
.summary dt { color: var(--ink-soft); } .summary dd { margin: 0; font-weight: 600; }
.summary .inner { padding: 14px 18px 4px; }

/* choose */
.choose h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); text-align: center; }
.choose .sub { color: var(--ink-soft); margin-top: 8px; text-align: center; }
.option { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 20px; margin-top: 14px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; transition: border-color .15s, background .15s, transform .15s; }
.option:hover:not([disabled]) { border-color: var(--green); background: var(--chip); transform: translateY(-2px); }
.option[disabled] { opacity: .6; cursor: not-allowed; }
.option .ico { width: 48px; height: 48px; font-size: 1.4rem; background: var(--green-soft); }
.option b { display: block; font-family: var(--heading); font-size: 1rem; font-weight: 600; }
.option > span > span { color: var(--ink-soft); font-size: .86rem; }
.option .tag { margin-left: auto; font-size: .72rem; font-weight: 700; background: var(--chip); padding: 4px 10px; border-radius: 999px; white-space: nowrap; color: var(--ink-faint); }

/* login */
.auth { display: grid; grid-template-columns: 1.1fr .9fr; max-width: 900px; margin: 0 auto; overflow: hidden; }
.auth-form { padding: clamp(24px, 4vw, 44px); }
.auth-form h1 { font-size: 1.8rem; }
.auth-form .sub { color: var(--ink-soft); margin-top: 6px; font-size: .92rem; }
.auth-art { background: var(--green-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 34px; gap: 14px; }
.auth-art .lock { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); color: var(--green-deep); display: grid; place-items: center; font-size: 1.6rem; }
.auth-art p { font-family: var(--heading); font-weight: 700; font-size: 1.15rem; line-height: 1.3; max-width: 16ch; color: var(--green-deep); }
.auth-art small { color: var(--ink-soft); font-size: .84rem; max-width: 26ch; }
@media (max-width: 760px) { .auth { grid-template-columns: 1fr; } .auth-art { display: none; } }
.divider { display: flex; align-items: center; gap: 12px; color: var(--ink-faint); font-size: .8rem; margin: 20px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sso { display: grid; gap: 10px; }

/* searching */
.searching { text-align: center; }
.search-ico { width: 72px; height: 72px; border-radius: 50%; background: var(--green-soft); display: grid; place-items: center; font-size: 1.9rem; margin: 0 auto 18px; animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.checklist { text-align: left; list-style: none; padding: 0; margin: 24px auto; display: grid; gap: 12px; max-width: 400px; }
.checklist li { display: flex; gap: 12px; align-items: center; color: var(--ink-faint); font-size: .9rem; transition: color .3s; }
.checklist .mk { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; }
.checklist .mk svg { width: 12px; height: 12px; display: none; }
.checklist li.done { color: var(--ink); }
.checklist li.done .mk { background: var(--green); border-color: var(--green); color: #fff; }
.checklist li.done .mk svg { display: block; }
.checklist li.now .mk { border-color: var(--green); border-top-color: transparent; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.back { background: none; border: 0; cursor: pointer; color: var(--ink-soft); font-size: .86rem; margin-bottom: 14px; padding: 4px 0; }
.back:hover { color: var(--ink); }

/* ---------- Virasat AI ---------- */
.ai-fab { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: inline-flex; gap: 9px; align-items: center; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 13px 20px; font-weight: 700; font-size: .88rem; cursor: pointer; box-shadow: 0 14px 30px -12px rgba(20, 20, 16, .6); transition: transform .15s; }
.ai-fab:hover { transform: translateY(-2px); }
.ai-fab svg { width: 18px; height: 18px; }
@media (max-width: 560px) { .ai-fab { padding: 14px; right: 12px; bottom: 12px; } .ai-fab .t { display: none; } }
.ai { position: fixed; right: 18px; bottom: 18px; z-index: 70; width: min(400px, calc(100vw - 24px)); height: min(640px, calc(100vh - 36px)); display: none; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 30px 70px -20px rgba(20, 20, 16, .45); overflow: hidden; }
.ai.open { display: flex; }
.ai header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.ai header b { font-family: var(--heading); font-size: 1rem; }
.ai header .beta { font-size: .68rem; background: var(--green-soft); color: var(--green-deep); border-radius: 999px; padding: 2px 8px; margin-left: 8px; font-weight: 700; }
.ai header button { background: none; border: 0; cursor: pointer; font-size: 1.4rem; line-height: 1; color: var(--ink-soft); padding: 4px 8px; }
.ai .log { flex: 1; overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; padding: 11px 14px; border-radius: 14px; font-size: .88rem; white-space: pre-wrap; }
.msg.bot { background: var(--chip); border-top-left-radius: 4px; }
.msg.me { background: var(--ink); color: var(--bg); align-self: flex-end; border-top-right-radius: 4px; }
.msg.err { background: var(--red-soft); color: var(--red); }
.ai .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 10px; }
.ai .chips button { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: .78rem; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
.ai .chips button:hover { border-color: var(--green); color: var(--ink); }
.ai form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.ai form input { flex: 1; border: 1.5px solid var(--line); border-radius: 999px; padding: 10px 16px; background: var(--bg); }
.ai form input:focus { outline: none; border-color: var(--green); }
.ai form button { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; display: grid; place-items: center; }
.ai form button svg { width: 17px; height: 17px; }
.ai form button[disabled] { opacity: .5; }
.ai .foot { font-size: .7rem; color: var(--ink-faint); padding: 0 16px 12px; display: flex; justify-content: space-between; gap: 10px; }

dialog.video { border: 0; border-radius: 20px; padding: 0; width: min(760px, 94vw); background: var(--surface); color: var(--ink); }
dialog.video::backdrop { background: rgba(20, 24, 20, .6); }
dialog.video .inner { padding: 20px; }
dialog.video video { width: 100%; border-radius: 12px; background: #000; }

.site-footer { border-top: 1px solid var(--line); padding: 26px 0 40px; font-size: .82rem; color: var(--ink-faint); }
.site-footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; }
.site-footer nav { display: flex; gap: 20px; }
.site-footer a { color: var(--ink-soft); font-weight: 600; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* Landing page (Evernote edition), scoped under .lp so it cannot clash with the app screens. */
.lp .hero {max-width:760px; margin:40px auto 0; text-align:center; padding:0 24px;}
.lp .hero h1 {font-size:clamp(2.2rem,5.4vw,3.6rem); line-height:1.08; letter-spacing:-0.01em; margin-bottom:20px;}
.lp .hero p {font-size:1.08rem; color:var(--ink-soft); line-height:1.6; max-width:52ch; margin:0 auto 32px;}
.lp .hero-actions {display:flex; flex-direction:column; align-items:center; gap:14px;}
.lp .btn-primary {display:inline-block; padding:15px 30px; border-radius:999px; border:none; background:var(--ink); color:var(--bg);
    font-weight:700; font-size:1rem; cursor:pointer; transition:transform .15s ease, background .15s ease, box-shadow .15s ease;}
.lp .btn-primary:hover {transform:translateY(-2px); background:var(--ink-soft); box-shadow:0 16px 30px -16px rgba(20,20,16,0.45);}
.lp .btn-primary:active {transform:translateY(0);}
.lp .hero-actions .alt {font-size:0.9rem; color:var(--ink-soft);}
.lp .hero-actions .alt a {font-weight:700; color:var(--ink); text-decoration:underline;}
.lp .shot-wrap {max-width:1000px; margin:56px auto 0; padding:0 24px;}
.lp .shot {background:var(--surface); border:1px solid var(--line); border-radius:20px 20px 0 0;
    box-shadow:0 40px 80px -40px rgba(20,20,16,0.35); overflow:hidden;}
.lp .shot-bar {display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); font-size:0.8rem; color:var(--ink-faint);}
.lp .shot-bar .crumb {display:flex; align-items:center; gap:6px;}
.lp .shot-bar .sep {opacity:0.5;}
.lp .shot-body {display:grid; grid-template-columns: 200px 1fr; min-height:340px;}
.lp .shot-side {border-right:1px solid var(--line); padding:20px 16px; display:flex; flex-direction:column; gap:6px;}
.lp .shot-side .si {display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; font-size:0.84rem; color:var(--ink-soft);}
.lp .shot-side .si.active {background:var(--chip); color:var(--ink); font-weight:600;}
.lp .shot-main {padding:28px 32px;}
.lp .shot-main h3 {font-size:1.3rem; margin-bottom:18px;}
.lp .asset-row {display:flex; align-items:center; justify-content:space-between; padding:13px 16px;
    border:1px solid var(--line); border-radius:12px; margin-bottom:10px; font-size:0.88rem;
    transition:border-color .15s ease, background .15s ease, transform .15s ease;}
.lp .asset-row:hover {border-color:var(--green); background:var(--chip); transform:translateX(3px);}
.lp .shot-side .si {cursor:pointer; transition:background .15s ease, color .15s ease;}
.lp .shot-side .si:hover {background:var(--chip); color:var(--ink);}
.lp .asset-row .name {display:flex; align-items:center; gap:10px; font-weight:600;}
.lp .asset-row .icon {width:30px; height:30px; border-radius:8px; background:var(--chip); display:flex; align-items:center; justify-content:center; font-size:0.9rem;}
.lp .status {padding:5px 12px; border-radius:999px; font-size:0.76rem; font-weight:700;}
.lp .status.yes {background:var(--green-soft); color:var(--green-deep);}
.lp .status.no {background:#fbe3e1; color:#a3352d;}
.lp .status.unknown {background:var(--chip); color:var(--ink-faint);}
@media (max-width:720px) {
.lp .shot-body {grid-template-columns:1fr;}
.lp .shot-side {display:none;}
}
.lp .strip {max-width:1000px; margin:70px auto; padding:0 24px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:30px; text-align:center;}
.lp .strip .si-item {display:flex; flex-direction:column; align-items:center; gap:10px;}
.lp .strip .si-icon {width:52px; height:52px; border-radius:14px; background:var(--green-soft); color:var(--green-deep);
    display:flex; align-items:center; justify-content:center; font-size:1.3rem;
    transition:transform .2s ease, background .2s ease;}
.lp .strip .si-item:hover .si-icon {transform:scale(1.1) rotate(-4deg); background:var(--green); color:#fff;}
.lp .strip .si-item span {font-size:0.86rem; font-weight:600; color:var(--ink-soft);}
@media (max-width:760px) {
.lp .strip {grid-template-columns:repeat(2,1fr);}
}
.lp .feat-row {max-width:1080px; margin:0 auto 100px; padding:0 24px;
    display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:center;}
.lp .feat-row.rev {direction:rtl;}
.lp .feat-row.rev > * {direction:ltr;}
.lp .feat-copy .tag {display:inline-block; font-size:0.74rem; font-weight:700; color:var(--green-deep);
    background:var(--green-soft); padding:5px 12px; border-radius:999px; margin-bottom:16px;}
.lp .feat-copy h2 {font-size:clamp(1.5rem,3vw,2.1rem); margin-bottom:16px; line-height:1.2;}
.lp .feat-copy p {font-size:1rem; color:var(--ink-soft); line-height:1.65;}
.lp .feat-visual {background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px;
    box-shadow:0 30px 60px -36px rgba(20,20,16,0.3);}
.lp .fv-title {font-size:0.8rem; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:14px;}
.lp .fv-item {display:flex; align-items:center; justify-content:space-between; padding:11px 14px; border-radius:10px; background:var(--chip); margin-bottom:8px; font-size:0.86rem; font-weight:600;}
.lp .fv-item .sdot {width:8px; height:8px; border-radius:50%;}
.lp .fv-item.yes .sdot {background:var(--green);}
.lp .fv-item.no .sdot {background:#c65b52;}
.lp .fv-item.unknown .sdot {background:#c9a24a;}
.lp .lock-visual {display:flex; flex-direction:column; align-items:center; text-align:center; padding:20px 0;}
.lp .lock-visual .lock-icon {width:64px; height:64px; border-radius:50%; background:var(--green-soft); color:var(--green-deep);
    display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin-bottom:16px;}
.lp .lock-visual p {font-size:0.86rem; color:var(--ink-soft); max-width:26ch;}
@media (max-width:820px) {
.lp .feat-row, .lp .feat-row.rev {grid-template-columns:1fr; direction:ltr;}
}
.lp .grid3 {max-width:1080px; margin:0 auto 100px; padding:0 24px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
.lp .grid3 .card {background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;}
.lp .grid3 .card:hover {transform:translateY(-6px); border-color:transparent; box-shadow:0 30px 50px -30px rgba(20,20,16,0.35);}
.lp .grid3 .card .ic {width:44px; height:44px; border-radius:12px; background:var(--green-soft); color:var(--green-deep);
    display:flex; align-items:center; justify-content:center; font-size:1.15rem; margin-bottom:16px;
    transition:transform .2s ease;}
.lp .grid3 .card:hover .ic {transform:scale(1.12);}
.lp .grid3 .card h3 {font-size:1.02rem; margin-bottom:8px;}
.lp .grid3 .card p {font-size:0.87rem; color:var(--ink-soft); line-height:1.6; margin:0;}
@media (max-width:820px) {
.lp .grid3 {grid-template-columns:1fr; max-width:440px;}
}
.lp .faq {max-width:760px; margin:0 auto 100px; padding:0 24px;}
.lp .faq h2 {text-align:center; font-size:clamp(1.5rem,3vw,2rem); margin-bottom:36px;}
.lp .faq details {border-bottom:1px solid var(--line); padding:18px 0;}
.lp .faq summary {list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:0.96rem; transition:color .15s ease;}
.lp .faq summary::-webkit-details-marker {display:none;}
.lp .faq summary:hover {color:var(--green-deep);}
.lp .faq .plus {font-size:1.3rem; color:var(--ink-faint); display:inline-block; transition:transform .2s ease, color .2s ease;}
.lp .faq details[open] .plus {transform:rotate(45deg); color:var(--green);}
.lp .faq details p {animation:faqIn .2s ease;}
@keyframes faqIn { from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
.lp .faq p {margin:12px 0 0; color:var(--ink-soft); font-size:0.88rem; line-height:1.6;}
.lp .cta-band {max-width:1080px; margin:0 auto 90px; padding:70px 24px; text-align:center;
    background:var(--ink); color:var(--bg); border-radius:28px;}
.lp .cta-band h2 {color:var(--bg); font-size:clamp(1.6rem,3.4vw,2.3rem); margin-bottom:14px;}
.lp .cta-band p {color:rgba(246,243,234,0.68); margin-bottom:30px; font-size:1rem;}
.lp .cta-band .btn-primary {background:var(--bg); color:var(--ink);}
.lp .cta-band .btn-primary:hover {background:#fff;}
.lp .reveal {opacity:0; transform:translateY(22px); transition:opacity .6s ease, transform .6s ease;}
.lp .reveal.in {opacity:1; transform:translateY(0);}
@media (prefers-reduced-motion: reduce) {
.lp .reveal {opacity:1; transform:none; transition:none;}
}

      check("dod", f.dod.value && (f.dod.value > today || f.dod.value < f.dob.value), "Date of death must be after birth and not in the future.");
      check("aadhaar", digits(f.aadhaar.value).length !== 12, "Enter all 12 digits of the Aadhaar number.");
      if (!ok) return form.querySelector('[aria-invalid="true"]')?.focus();
      Object.assign(state.deceased, { name, dob: f.dob.value, dod: f.dod.value, aadhaar: digits(f.aadhaar.value) });
      return go("/step2");
    }
    if (kind === "step2") {
      const a = state.applicant;
      if (!a.otpSent) {
        if (digits(f.aadhaar.value).length !== 12) {
          setErr(form, "aadhaar", "Enter all 12 digits of your Aadhaar number.");
          return f.aadhaar.focus();
        }
        a.aadhaar = digits(f.aadhaar.value);
        a.otpSent = true;
        render();
        return $("#otp")?.focus();
      }
      if (digits(f.otp.value).length !== 6) {
        setErr(form, "otp", "Enter the 6-digit OTP.");
        return f.otp.focus();
      }
      a.verified = true;
      return go("/step3");
    }
    if (kind === "step3") {
      let ok = true;
      if (!f.rel.value) {
        setErr(form, "rel", "Select your relationship.");
        ok = false;
      } else setErr(form, "rel", "");
      const box = f.ok;
      const err = $('[data-err="ok"]', form);
      if (!box.checked) {
        err.textContent = "Please confirm before starting the search.";
        ok = false;
      } else err.textContent = "";
      if (!ok) return;
      state.relationship = f.rel.value;
      state.confirmed = true;
      state.submitted = true;
      return go("/searching");
    }
  });
  document.addEventListener("click", (e) => {
    const sc = e.target.closest("[data-scroll]");
    if (sc) {
      e.preventDefault();
      $("#nav").classList.remove("open");
      return scrollToId(sc.dataset.scroll);
    }
    const t = e.target.closest("[data-action]");
    if (!t) return;
    const act = t.dataset.action;
    if (act === "goto") return go(t.dataset.to);
    if (act === "method") {
      state.applicant.method = t.dataset.id;
      return render();
    }
    if (act === "resend") {
      state.applicant.otpSent = false;
      return render();
    }
    if (act === "filter") {
      state.filter = t.dataset.id;
      if (!location.hash.startsWith("#/results")) return go("/results");
      return render();
    }
    if (act === "dtab") {
      state.detailTab = t.dataset.id;
      return render();
    }
    if (act === "ask-asset") {
      const a = ASSETS.find((x) => x.id === t.dataset.id);
      openAI();
      return ask(`What should I do next for the ${a.name}? Its nominee status is: ${STATUS[a.status].label.toLowerCase()}.`);
    }
  });
  var header = $("#siteHeader");
  addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 6), { passive: true });
  $("#menuBtn").addEventListener("click", () => {
    const open = $("#nav").classList.toggle("open");
    $("#menuBtn").setAttribute("aria-expanded", String(open));
  });
  var ai = $("#ai");
  var log = $("#aiLog");
  var input = $("#aiInput");
  var sendBtn = $("#aiSend");
  var aiStarted = false;
  var NUM_RE = /(?<!\d)\d(?:[\s-]?\d){7,}(?!\d)/g;
  var PAN_RE = /\b[A-Z]{5}\d{4}[A-Z]\b/gi;
  function redact(q) {
    const out = q.replace(NUM_RE, "[number removed]").replace(PAN_RE, "[ID removed]");
    return { text: out, changed: out !== q };
  }
  function bubble(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  function aiChipsRefresh() {
    $("#aiChips").innerHTML = ["What is a nominee?", "What documents are required?", "How to claim a bank account?", "What if there is no nominee?"].map((q) => `<button type="button">${q}</button>`).join("");
  }
  async function loadQuota() {
    try {
      const u = await (await fetch("/api/usage")).json();
      $("#aiQuota").textContent = u.mock ? "Demo mode: sample answers" : `${u.remaining} AI answers left today`;
    } catch {
      $("#aiQuota").textContent = "AI server not running";
    }
  }
  function openAI() {
    ai.classList.add("open");
    $("#aiOpen").style.display = "none";
    if (!aiStarted) {
      aiStarted = true;
      bubble("Hi, I\u2019m Virasat AI. I can help with general information about assets, nominees and next steps. How can I help you today?", "bot");
      loadQuota();
    }
    input.focus();
  }
  function closeAI() {
    ai.classList.remove("open");
    $("#aiOpen").style.display = "";
    $("#aiOpen").focus();
  }
  $("#aiOpen").addEventListener("click", openAI);
  $("#aiClose").addEventListener("click", closeAI);
  ai.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeAI();
  });
  $("#aiChips").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) ask(b.textContent);
  });
  $("#aiForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (q) {
      input.value = "";
      ask(q);
    }
  });
  async function ask(raw) {
    const { text, changed } = redact(raw);
    bubble(text, "me");
    if (changed) bubble("I removed a long number from your message. Please don\u2019t share ID or account numbers here.", "bot");
    sendBtn.disabled = true;
    const wait = bubble("Thinking\u2026", "bot");
    const assets = state.submitted ? ASSETS.map((a) => ({ name: a.name, nominee: STATUS[a.status].nominee })) : [];
    try {
      const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: text, assets }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        wait.className = "msg err";
        wait.textContent = data.error || "Something went wrong. Try again.";
      } else {
        wait.textContent = data.answer;
        if (data.mock) $("#aiQuota").textContent = "Demo mode: sample answers";
        else $("#aiQuota").textContent = `${data.cached ? "Saved answer, no quota used \xB7 " : ""}${data.remaining} AI answers left today`;
      }
    } catch {
      wait.className = "msg err";
      wait.textContent = "Can\u2019t reach the Virasat server. Run npm start and open http://localhost:3000.";
    } finally {
      sendBtn.disabled = false;
      log.scrollTop = log.scrollHeight;
    }
  }
  hydrateIcons(document);
  addEventListener("hashchange", render);
  render();
})();

</script>
</body>
</html>
