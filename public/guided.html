<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Virasat – Find what they left behind</title>
  <meta name="description" content="Virasat helps families discover a loved one's financial and other assets, check nominee details and get clear next steps.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="site-header" id="siteHeader">
    <div class="wrap">
      <a class="logo" href="#/" aria-label="Virasat home"><span data-icon="logo"></span>Virasat</a>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="#/how">How it works</a>
        <a href="#/assets">Assets we find</a>
        <a href="#/resources">Resources</a>
        <a href="#/about">About</a>
      </nav>
      <div class="header-actions">
        <a class="link-btn hide-sm" href="#/login">Log in</a>
        <a class="btn btn-primary btn-sm hide-sm" href="#/start">Get started free <span data-icon="arrow"></span></a>
        <button class="btn btn-sm menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menu</button>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 2026 Virasat. Guidance only, not legal or financial advice.</span>
      <nav aria-label="Footer"><a href="#/how">How it works</a><a href="#/assets">Assets we find</a><a href="#/privacy">Privacy</a></nav>
    </div>
  </footer>

  <button class="ai-fab" id="aiOpen" aria-haspopup="dialog" aria-label="Ask Virasat AI"><span data-icon="spark"></span><span class="t">Ask Virasat AI</span></button>
  <aside class="ai" id="ai" role="dialog" aria-label="Virasat AI assistant">
    <header><div><b>Virasat AI</b><span class="beta">Beta</span></div><button id="aiClose" aria-label="Close assistant">×</button></header>
    <div class="log" id="aiLog" aria-live="polite"></div>
    <div class="chips" id="aiChips"></div>
    <form id="aiForm">
      <label class="sr-only" for="aiInput">Your question</label>
      <input id="aiInput" maxlength="600" autocomplete="off" placeholder="Type your question…">
      <button type="submit" id="aiSend" aria-label="Send"><span data-icon="send"></span></button>
    </form>
    <div class="foot"><span id="aiQuota">&nbsp;</span><span>General guidance only. Don’t type ID or account numbers.</span></div>
  </aside>

  <dialog class="video" id="videoDlg">
    <div class="inner" id="videoBody"></div>
  </dialog>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
